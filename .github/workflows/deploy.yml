name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight deploy at a time; cancel older queued runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Matches the toolchain used to develop the port. Pin to a specific
          # version (e.g. 3.1.74) if you need fully reproducible builds.
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build POWDER to WebAssembly
        run: bash scripts/build.sh
        env:
          # Ubuntu runners always have g++/gcc; POWDER's host support tools
          # build fine with them.
          HOST_CXX: g++
          HOST_CC: gcc

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
